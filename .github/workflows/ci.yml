name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Core tier on Windows (no pyzeo / tblite wheels there).
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core tier + test tools)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not external"
      - name: CLI smoke test
        run: |
          mofsift --version
          mofsift init ci-example.yaml
          mofsift doctor --json

  external:
    name: tests with PORMAKE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the generate extra
        run: pip install -e ".[dev,generate]"
      - name: Tests that build real structures
        run: pytest -m external
      - name: Example run
        run: |
          mofsift doctor examples/pormake_small.yaml
          mofsift run examples/pormake_small.yaml

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/mofsift init wheel-example.yaml && /tmp/wheel-env/bin/mofsift doctor --json

# Added with the stages that need them: pyzeo and tblite in the external job, and a docs build.
