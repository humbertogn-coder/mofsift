name: Something does not work
description: A command failed, or a result looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please look at docs/troubleshooting.md first: most surprises are a stage that was skipped for a recorded reason.
        Do not attach unpublished structures or results; a public example that shows the same problem is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command and what it printed
      description: Include the lines of work/run.log for that run if there are any.
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The config
      description: The whole file, or the smallest one that shows the problem.
      render: yaml
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mofsift doctor --json`
      description: It lists the versions of mofsift, Python and the tools.
      render: json
    validations:
      required: true
